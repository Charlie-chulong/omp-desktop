name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      macos:
        description: Build signed and notarized macOS arm64 packages (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Stock electron skips on any nonempty string; mini-electron treats "0" as false.
  # Skip the unused stock runtime while allowing mini-electron to install on clean CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
  LEFTHOOK: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and select targets
        id: targets
        uses: actions/github-script@v7
        env:
          BUILD_MACOS: ${{ inputs.macos || vars.MACOS_RELEASE_ENABLED == 'true' }}
        with:
          script: |
            const fs = require('node:fs');
            const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const desktop = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'));
            if (root.version !== desktop.version) {
              throw new Error('Root and desktop package versions must match');
            }
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/v${desktop.version}`) {
              throw new Error(`Release tag must be v${desktop.version}`);
            }
            const include = [
              { os: 'windows-2022', target: 'windows-x64', bundle: true },
              { os: 'windows-2022', target: 'windows-x64', bundle: false }
            ];
            if (process.env.BUILD_MACOS === 'true') {
              include.push({ os: 'macos-14', target: 'darwin-arm64', bundle: true });
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Check macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macOS release credential: $name"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Download verified OMP binary
        if: matrix.bundle
        run: npm run download:omp -- ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package Windows
        if: runner.os == 'Windows' && matrix.bundle
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package Windows without OMP
        if: runner.os == 'Windows' && !matrix.bundle
        run: npm run build:windows:no-omp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package and verify macOS
        if: runner.os == 'macOS'
        run: npm run build:mac
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Collect release assets
        uses: actions/github-script@v7
        env:
          BUNDLE_OMP: ${{ matrix.bundle }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const source = 'packages/desktop/release';
            const bundle = process.env.BUNDLE_OMP === 'true';
            const files = fs.readdirSync(source).filter(name =>
              /\.(exe|dmg|zip|blockmap)$/.test(name) ||
              (bundle && /\.yml$/.test(name) && !name.startsWith('builder-')));
            const required = process.platform === 'win32'
              ? [/\.exe$/, /\.zip$/, /\.blockmap$/, ...(bundle ? [/\.yml$/] : [])]
              : [/\.dmg$/, /\.zip$/, /-mac\.yml$/];
            for (const pattern of required) {
              if (!files.some(name => pattern.test(name))) {
                throw new Error(`Missing release asset matching ${pattern}`);
              }
            }
            fs.mkdirSync('release-assets', { recursive: true });
            for (const name of files) fs.copyFileSync(path.join(source, name), path.join('release-assets', name));
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}${{ !matrix.bundle && '-no-omp' || '' }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to draft release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const repo = context.repo;
            const tag = context.ref.slice('refs/tags/'.length);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`Release ${tag} is already published; refusing to replace public assets`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: tag, draft: true,
                prerelease: tag.includes('-')
              }));
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            for (const name of fs.readdirSync('release-assets')) {
              const previous = existing.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release-assets', name))
              });
            }
            await core.summary.addLink('Review draft release', release.html_url).write();
